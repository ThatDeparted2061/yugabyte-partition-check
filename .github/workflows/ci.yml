name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./... && go test ./...

  # A short run against a real 3-node cluster: the invariant must hold.
  partition-check:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make up
      - run: go run ./cmd/ybcheck -duration 3m -quiet 8s -fault 12s
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report
          path: results/
      - if: failure()
        run: docker compose logs --tail 200
